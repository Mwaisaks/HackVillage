# Render Blueprint for the PayPal AI Hackathon 2026 fork (HACKATHON.md).
# One always-on Node web service: `next start` runs instrumentation.ts, which
# registers the pg-boss workers in-process, so no separate worker is needed.
# Migrations run during the build (scripts/migrate-if-production.mjs, RENDER=true).
services:
  - type: web
    name: hackvillage-paypal
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: hackvillage-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Set both to the service URL (e.g. https://hackvillage-paypal.onrender.com)
      # BEFORE the first build: NEXT_PUBLIC_APP_URL is inlined at build time.
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Paystack (KES) stays simulated: the hackathon demo uses PayPal sandbox.
      - key: PAYSTACK_ALLOW_SIMULATION_IN_PROD
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Filled in after registering https://<service>/api/webhooks/paypal in
      # the PayPal developer dashboard (sandbox app → Webhooks).
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

databases:
  - name: hackvillage-db
    plan: free
    region: frankfurt
    databaseName: hackvillage
